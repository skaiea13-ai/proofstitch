<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">ProofStitch system architecture</title>
  <desc id="description">A private Cloud Run service exposes a bounded dashboard and a fixed Google ADK demo. Server-issued synthetic evidence passes through a deterministic gate, while caller-supplied evidence is untrusted. Any external action stops at a fingerprint-bound human approval.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b22"/>
      <stop offset="0.52" stop-color="#071018"/>
      <stop offset="1" stop-color="#071a1b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a7cff"/>
      <stop offset="1" stop-color="#4ce5d5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#71809f"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #97a3bc; }
      .body { fill: #d9def0; }
      .line { stroke: #71809f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .card { fill: #101624; stroke: #2b3550; stroke-width: 1.5; }
      .small-card { fill: #151b2b; stroke: #303a56; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="150" cy="80" r="210" fill="#7655ff" opacity="0.09"/>
  <circle cx="1460" cy="100" r="240" fill="#36d7ca" opacity="0.07"/>

  <g class="sans">
    <text x="70" y="82" fill="#4ce5d5" font-size="18" font-weight="800" letter-spacing="3">PROOFSTITCH</text>
    <text x="70" y="132" fill="#f5f7ff" font-size="42" font-weight="760" letter-spacing="-1.2">Evidence before action</text>
    <text x="70" y="166" class="muted" font-size="18">Gemini interprets. Google ADK orchestrates. Deterministic code decides. A human authorizes.</text>

    <g filter="url(#shadow)">
      <rect x="70" y="215" width="270" height="520" rx="24" class="card"/>
      <rect x="380" y="215" width="780" height="520" rx="24" class="card"/>
      <rect x="1200" y="215" width="330" height="520" rx="24" class="card"/>
    </g>

    <text x="100" y="258" fill="#9a7cff" font-size="14" font-weight="800" letter-spacing="2">01 · INPUT CONTRACT</text>
    <text x="100" y="300" fill="#f5f7ff" font-size="25" font-weight="720">Release packet</text>
    <text x="100" y="327" class="muted" font-size="13">Caller proof is untrusted.</text>
    <text x="100" y="347" class="muted" font-size="13">Synthetic demo proof is server-issued.</text>

    <g class="mono" font-size="14">
      <rect x="100" y="368" width="210" height="54" rx="12" class="small-card"/>
      <circle cx="120" cy="395" r="5" fill="#9a7cff"/>
      <text x="138" y="400" class="body">requirements[]</text>
      <rect x="100" y="436" width="210" height="54" rx="12" class="small-card"/>
      <circle cx="120" cy="463" r="5" fill="#9a7cff"/>
      <text x="138" y="468" class="body">immutable_ref</text>
      <rect x="100" y="504" width="210" height="54" rx="12" class="small-card"/>
      <circle cx="120" cy="531" r="5" fill="#9a7cff"/>
      <text x="138" y="536" class="body">evidence[]</text>
      <rect x="100" y="572" width="210" height="54" rx="12" class="small-card"/>
      <circle cx="120" cy="599" r="5" fill="#9a7cff"/>
      <text x="138" y="604" class="body">requested_action</text>
    </g>
    <rect x="100" y="657" width="210" height="46" rx="12" fill="#122322" stroke="#286d66"/>
    <text x="120" y="685" fill="#74efb5" font-size="13" font-weight="680">No secrets or raw personal data</text>

    <text x="410" y="258" fill="#4ce5d5" font-size="14" font-weight="800" letter-spacing="2">02 · AGENTIC EXECUTION</text>
    <rect x="410" y="285" width="325" height="78" rx="16" fill="#171b35" stroke="#6956bd" stroke-width="1.5"/>
    <text x="435" y="317" fill="#c5baff" font-size="14" font-weight="800">GEMINI 3.6 FLASH</text>
    <text x="435" y="342" class="body" font-size="13">Developer API Free tier · fixed prompt only</text>
    <rect x="765" y="285" width="365" height="78" rx="16" fill="#102b2c" stroke="#2e8c83" stroke-width="1.5"/>
    <text x="790" y="317" fill="#7af4e8" font-size="14" font-weight="800">GOOGLE ADK TOOL ROUTER</text>
    <text x="790" y="342" class="body" font-size="15">One fixed non-executing function tool</text>
    <path d="M735 324H765" class="line"/>

    <rect x="410" y="397" width="720" height="214" rx="20" fill="#0d1522" stroke="url(#accent)" stroke-width="2"/>
    <text x="438" y="432" fill="#f5f7ff" font-size="20" font-weight="740">One-click evidence workflow</text>
    <text x="438" y="458" class="muted" font-size="14">Six visible actions; no external side effect.</text>

    <g font-size="13" text-anchor="middle">
      <rect x="438" y="486" width="118" height="74" rx="14" class="small-card"/>
      <text x="497" y="516" fill="#74efb5" font-weight="800">1 · INGEST</text>
      <text x="497" y="540" class="muted">bind ref</text>
      <rect x="574" y="486" width="118" height="74" rx="14" class="small-card"/>
      <text x="633" y="516" fill="#74efb5" font-weight="800">2 · COLLECT</text>
      <text x="633" y="540" class="muted">map proof</text>
      <rect x="710" y="486" width="118" height="74" rx="14" class="small-card"/>
      <text x="769" y="516" fill="#74efb5" font-weight="800">3 · VERIFY</text>
      <text x="769" y="540" class="muted">hash + time</text>
      <rect x="846" y="486" width="118" height="74" rx="14" class="small-card"/>
      <text x="905" y="516" fill="#74efb5" font-weight="800">4 · PRIVACY</text>
      <text x="905" y="540" class="muted">scan metadata</text>
      <rect x="982" y="486" width="118" height="74" rx="14" class="small-card"/>
      <text x="1041" y="516" fill="#74efb5" font-weight="800">5 · RECEIPT</text>
      <text x="1041" y="540" class="muted">bounded TTL</text>
    </g>
    <path d="M556 523H574M692 523H710M828 523H846M964 523H982" class="line"/>

    <rect x="535" y="640" width="470" height="62" rx="15" fill="#171b2a" stroke="#ffc76a" stroke-width="1.5"/>
    <text x="570" y="666" fill="#ffc76a" font-size="13" font-weight="800">DETERMINISTIC PYTHON GATE</text>
    <text x="570" y="688" class="body" font-size="14">Trust · freshness · privacy · fingerprint-bound scope</text>
    <path d="M770 611V640" class="line"/>

    <rect x="410" y="622" width="104" height="80" rx="15" fill="#102326" stroke="#286d66"/>
    <text x="462" y="650" fill="#4ce5d5" font-size="11" font-weight="800" text-anchor="middle">CLOUD RUN</text>
    <text x="462" y="672" class="muted" font-size="11" text-anchor="middle">Private IAM</text>
    <text x="462" y="689" class="muted" font-size="11" text-anchor="middle">min 0 · max 1</text>

    <path d="M340 475H380" class="line"/>
    <path d="M1130 324H1165V475H1200" class="line"/>
    <path d="M1005 671H1165V475" class="line"/>

    <text x="1230" y="258" fill="#ffc76a" font-size="14" font-weight="800" letter-spacing="2">03 · DECISION + HANDOFF</text>
    <rect x="1230" y="294" width="270" height="70" rx="15" fill="#27151e" stroke="#7d3348"/>
    <circle cx="1255" cy="329" r="6" fill="#ff758f"/>
    <text x="1275" y="325" fill="#ff9aac" font-size="14" font-weight="800">BLOCKED</text>
    <text x="1275" y="346" class="muted" font-size="12">Missing, untrusted, or unsafe proof</text>

    <rect x="1230" y="382" width="270" height="82" rx="15" fill="#2a2114" stroke="#8e6728"/>
    <circle cx="1255" cy="417" r="6" fill="#ffc76a"/>
    <text x="1275" y="413" fill="#ffd992" font-size="14" font-weight="800">AWAITING_APPROVAL</text>
    <text x="1275" y="436" class="muted" font-size="12">6 · request fingerprint-bound scope</text>

    <rect x="1230" y="482" width="270" height="82" rx="15" fill="#102620" stroke="#287256"/>
    <circle cx="1255" cy="517" r="6" fill="#74efb5"/>
    <text x="1275" y="513" fill="#9bf5c9" font-size="14" font-weight="800">READY_FOR_HUMAN_ACTION</text>
    <text x="1275" y="536" class="muted" font-size="12">Fingerprint preserved</text>

    <line x1="1218" y1="593" x2="1512" y2="593" stroke="#ffc76a" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="1365" y="619" fill="#ffc76a" font-size="12" font-weight="760" text-anchor="middle" letter-spacing="1">HUMAN-ONLY BOUNDARY</text>
    <rect x="1230" y="640" width="270" height="62" rx="15" fill="#17202d" stroke="#55627d"/>
    <text x="1365" y="666" fill="#f5f7ff" font-size="15" font-weight="720" text-anchor="middle">Human operator</text>
    <text x="1365" y="688" class="muted" font-size="12" text-anchor="middle">External action stays outside the agent</text>

    <rect x="70" y="782" width="1460" height="62" rx="18" fill="#0f1521" stroke="#273149"/>
    <circle cx="105" cy="813" r="6" fill="#74efb5"/>
    <text x="124" y="819" class="body" font-size="14">Proof verified</text>
    <circle cx="280" cy="813" r="6" fill="#ffc76a"/>
    <text x="299" y="819" class="body" font-size="14">Human decision required</text>
    <text x="1495" y="819" fill="#4ce5d5" font-size="14" font-weight="780" text-anchor="end">external_action_executed = false</text>
  </g>
</svg>
